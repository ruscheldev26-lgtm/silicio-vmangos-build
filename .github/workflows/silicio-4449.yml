name: Silicio - experimento baseline 4449
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: silicio-4449
  cancel-in-progress: false
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Obter somente o repositorio de build
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 verificado em 21/10/2026
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - name: Obter fonte publico fixado
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: vmangos/core
          ref: e968eae18407ea557064c32f4fdcea96464f5372
          path: source
          fetch-depth: 1
          persist-credentials: false
      - name: Compilar e preparar artefato
        run: |
          & ./control/scripts/build.ps1 -SourceDir ./source -ControlDir ./control -OutputDir ./payload 
      - name: Verificar estrutura e hashes sem executar o servidor
        run: python ./control/scripts/verify_artifact.py ./payload --variant baseline
      - name: Disponibilizar somente o pacote preparado
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 verificado em 21/10/2026
        with:
          name: silicio-4449-baseline-${{ github.run_id }}-${{ github.run_attempt }}
          path: payload/
          if-no-files-found: error
          retention-days: 1
          compression-level: 6
          include-hidden-files: false
      - name: Registrar identidade do artefato
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.artifact.outputs.artifact-digest }}
        run: |
          'Artefato: ' + $env:ARTIFACT_URL | Add-Content $env:GITHUB_STEP_SUMMARY
          'Digest SHA-256 do arquivo de artefato: ' + $env:ARTIFACT_DIGEST | Add-Content $env:GITHUB_STEP_SUMMARY
